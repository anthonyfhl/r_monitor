<html><script id="__NEXT_DATA__" type="application/json">{"new_customer": "October 2026 new customer 6.7%", "existing_customer": "<h3><strong>Total Savings Interest Rate </strong> up to HKD 3.15% p.a. | USD 4.10%<sup>2</sup></h3>\n<p><strong style=\"color: #f33;\">Log in to DBS digibank HK app and deposit Eligible New Funds<sup>1</sup> to earn e$aver interest now!</strong></p>\n<img src=\"/iwov-resources/media/images/promotions/deposit/body/202609_ETB_Headline_Rate_EN.png\" width=\"1000\" height=\"325\" align=\"center\" />\n<div class=\"sc-1mhpmrk kWPuCU\" data-testid=\"spacer\">&nbsp;</div>\n<p style=\"display: none;\"><strong style=\"color: red;\">Due to overwhelming response, Registration Period is ended on 14 August 2026.</strong><br /><a class=\"btn btn-primary\" style=\"background-color: #bdbdbd; border: 1px solid lightgray;\" target=\"_blank\" rel=\"noopener noreferrer\">Registration is ended \u00e2\u0080\u008b</a></p>\n<p style=\"text-align: left; display: block;\"><strong><span style=\"color: #e03e2d;\"><a class=\"btn btn-primary\" style=\"border: 1px solid lightgray;\" href=\"#etb-screen\" rel=\"noopener\">Register via DBS digibank HK App</a></span></strong></p>\n<div class=\"sc-1mhpmrk kWPuCU\" data-testid=\"spacer\">&nbsp;</div>\n<h2 class=\"mt-20 mb-20\">How to calculate Preferential Total Savings Interest Rate?</h2>\n<!-- Added table-scroll wrapper div for mobile compatibility -->\n<div class=\"table-scroll\">\n<table class=\"rate-table highlight-last\">\n<tbody>\n<tr>\n<th>Eligible New Funds</th>\n<th>e$aver Interest Rate</th>\n<th>Basic Savings Interest Rate</th>\n<th>Total Savings Interest Rate*</th>\n</tr>\n<tr>\n<td>HK$200,000 - HK$4,999,999</td>\n<td>+3.025%</td>\n<td>0.001%</td>\n<td>Up to 3.026%</td>\n</tr>\n<tr>\n<td>HK$5,000,000 &ndash; HK$10,000,000</td>\n<td>+3.025%</td>\n<td>0.125%</td>\n<td>Up to 3.15%</td>\n</tr>\n<tr>\n<td>US$25,000 &ndash; US$1,300,000</td>\n<td>+4.099%</td>\n<td>0.001%</td>\n<td>Up to 4.10%</td>\n</tr>\n</tbody>\n</table>\n</div>\n<p class=\"caption-dark mt-10\"><sup>*</sup>Total Savings Interest Rate includes Basic Savings Interest Rate &amp; e$aver Interest Rate. All Total Preferential Savings Rates above are as of 6 September 2026 and for reference only. Please <a href=\"https://www.dbs.com.hk/personal/ratesfees-tiered.page?source=external&amp;pid=hk-personal-en-bank-esaver-etb_tab\" target=\"\">click here</a> for the details of basic savings interest rate.</p>\n<div class=\"sc-1mhpmrk kWPuCU\" data-testid=\"spacer\">&nbsp;</div>\n<!-- Added table-scroll wrapper div for mobile compatibility -->\n<div class=\"table-scroll\">\n<table class=\"rate-table\">\n<tbody>\n<tr>\n<th style=\"vertical-align: top;\">Benchmark Date&nbsp;</th>\n<th style=\"vertical-align: top;\">Registration Date</th>\n<th style=\"vertical-align: top;\">Reward <br />Counting Period</th>\n<th style=\"vertical-align: top;\">Rewards<br />Credit Date<sup>3</sup></th>\n</tr>\n<tr>\n<td style=\"vertical-align: top;\">3 September 2026</td>\n<td style=\"vertical-align: top;\">From now until 30 September 2026&nbsp;</td>\n<td style=\"vertical-align: top;\">7 September 2026 - 8 January 2027&nbsp;</td>\n<td style=\"vertical-align: top;\">On or before 31 March 2027&nbsp;</td>\n</tr>\n</tbody>\n</table>\n</div>\n<p class=\"summary-footnote fine-print\">The promotion is not applicable to individual customers who is currently participating in the DBS e$aver Deposit Promotion for New Customers and Upgraded Customers; or previously registered for the DBS e$aver Deposit Promotion in August 2026 or previously registered for the DBS MCY &amp; Savings Account Bonus Interest Offer; or have become New DBS Account or DBS Treasures customer in last three months. Terms and Conditions apply. Please <a href=\"https://go.dbs.com/hk-esaver-etb-2609-tnc\" target=\"_blank\" rel=\"noopener\">click here</a>&nbsp;for more details.</p>\n<ol class=\"rate-terms caption mt-20\">\n<li>Eligible New Funds refers to the incremental balance comparing the Deposit Balance within the Reward Counting Period to HKD / USD Deposit Balance on 3 September 2026, according to the Bank&rsquo;s record.</li>\n<li>Interest rate is calculated on a daily basis and New Customer who fails to maintain such Eligible New Funds HK$200,000 and/or US$25,000 or above at the end of the Promotion on 8 January 2027 is not eligible to earn the Rewards.</li>\n<li>The Rewards will be credited directly to the designated account of the Eligible Customer on or before 31 March 2027.</li>\n</ol>\n<div class=\"sc-1mhpmrk kWPuCU\" data-testid=\"spacer\">&nbsp;</div>\n<h2>How to register e$aver?<a id=\"etb-screen\"></a></h2>\n<div id=\"register-carousel\" class=\"smash-carousel carousel slide\" data-ride=\"carousel\">\n<div class=\"smash-carousel-right\">\n<ol class=\"savings-steps carousel-indicators\">\n<li class=\"step-container active\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#register-carousel\" data-slide-to=\"0\">&nbsp;</div>\n<div class=\"step-line\">\n<div class=\"step-line-inner\">&nbsp;</div>\n</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 1:</span><br />Select &ldquo;<span style=\"font-weight: 600;\">e$aver</span>&rdquo; on the &ldquo;<span style=\"font-weight: 600;\">Save</span>&rdquo;</p>\n</li>\n<li class=\"step-container\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#register-carousel\" data-slide-to=\"1\">&nbsp;</div>\n<div class=\"step-line\">\n<div class=\"step-line-inner\">&nbsp;</div>\n</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 2:</span><br />Check e$aver benchmark<sup>4</sup> and eligible accounts</p>\n</li>\n<li class=\"step-container\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#register-carousel\" data-slide-to=\"2\">&nbsp;</div>\n<div class=\"step-line\">\n<div class=\"step-line-inner\">&nbsp;</div>\n</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 3:</span><br />Choose an account to receive e$aver interest reward</p>\n</li>\n<li class=\"step-container\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#register-carousel\" data-slide-to=\"3\">&nbsp;</div>\n<div class=\"step-line\">\n<div class=\"step-line-inner\">&nbsp;</div>\n</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 4:</span><br />Select the saving purpose and click &ldquo;<span style=\"font-weight: 600;\">confirm</span>&rdquo; to complete registration.</p>\n</li>\n<li class=\"step-container\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#register-carousel\" data-slide-to=\"4\">&nbsp;</div>\n<div class=\"step-line\">&nbsp;</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 5:</span><br />Registration confirmation page<sup>5</sup> will be shown upon successful registration</p>\n</li>\n</ol>\n</div>\n<!-- left -->\n<div class=\"smash-carousel-left\"><!-- Wrapper for slides -->\n<div class=\"carousel-inner\" role=\"listbox\">\n<div class=\"item active\"><img src=\"/iwov-resources/media/images/products/deposit/body/esaver/screenflow/Reg1_EN.png\" alt=\"Step 1\" /></div>\n<div class=\"item\"><img src=\"/iwov-resources/media/images/products/deposit/body/esaver/screenflow/Reg2_EN.png\" alt=\"Step 2\" /></div>\n<div class=\"item\"><img src=\"/iwov-resources/media/images/products/deposit/body/esaver/screenflow/Reg3_EN.png\" alt=\"Step 3\" /></div>\n<div class=\"item\"><img src=\"/iwov-resources/media/images/products/deposit/body/esaver/screenflow/Reg4_EN.png\" alt=\"Step 4\" /></div>\n<div class=\"item\"><img src=\"/iwov-resources/media/images/products/deposit/body/esaver/screenflow/Reg5_EN.png\" alt=\"Step 5\" /></div>\n</div>\n<!-- Controls --> <a class=\"left carousel-control\" role=\"button\" href=\"#register-carousel\" data-slide=\"prev\"> <span class=\"glyphicon glyphicon-chevron-left\" aria-hidden=\"true\"></span> <span class=\"sr-only\">Previous</span> </a> <a class=\"right carousel-control\" role=\"button\" href=\"#register-carousel\" data-slide=\"next\"> <span class=\"glyphicon glyphicon-chevron-right\" aria-hidden=\"true\"></span> <span class=\"sr-only\">Next</span> </a></div>\n</div>\n<div class=\"sc-1mhpmrk kWPuCU\" data-testid=\"spacer\">&nbsp;</div>\n<h2 class=\"mTop-40\">How to track your e$aver progress?</h2>\n<div id=\"track-carousel\" class=\"smash-carousel carousel slide\" data-ride=\"carousel\">\n<div class=\"smash-carousel-right\">\n<ol class=\"savings-steps carousel-indicators\">\n<li class=\"step-container active\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#track-carousel\" data-slide-to=\"0\">&nbsp;</div>\n<div class=\"step-line\">\n<div class=\"step-line-inner\">&nbsp;</div>\n</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 1:</span><br />Tap &ldquo;<span style=\"font-weight: 600;\">Add Funds</span>&rdquo; on the details page to deposit new funds and check the benchmark balance</p>\n</li>\n<li class=\"step-container\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#track-carousel\" data-slide-to=\"1\">&nbsp;</div>\n<div class=\"step-line\">\n<div class=\"step-line-inner\">&nbsp;</div>\n</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 2:</span><br />Review your e$aver progress within the DBS digibank HK App</p>\n</li>\n<li class=\"step-container\">\n<div class=\"step-content\">\n<div class=\"step-indicator\" data-target=\"#track-carousel\" data-slide-to=\"2\">&nbsp;</div>\n<div class=\"step-line\">&nbsp;</div>\n</div>\n<p class=\"step-description\"><span class=\"bold-text\">Step 3:</span><br />Earn e$aver extra interest rate<sup>6</sup></p>\n</li>\n</ol>\n</div>\n<!-- left -->\n<div class=\"smash-carousel-left\"><!-- Wrapper for slides -->\n<div class=\"carousel-inner\" role=\"listbox\">\n<div class=\"item active\"><img src=\"/iwov-resources/media/images/esaver/Progress1_EN.png\" alt=\"Step 1\" /></div>\n<div class=\"item\"><img src=\"/iwov-resources/media/images/esaver/Progress2_EN.png\" alt=\"Step 2\" /></div>\n<div class=\"item\"><img src=\"/iwov-resources/media/images/esaver/Progress3_EN.png\" alt=\"Step 3\" /></div>\n</div>\n<!-- Controls --> <a class=\"left carousel-control\" role=\"button\" href=\"#track-carousel\" data-slide=\"prev\"> <span class=\"glyphicon glyphicon-chevron-left\" aria-hidden=\"true\"></span> <span class=\"sr-only\">Previous</span> </a> <a class=\"right carousel-control\" role=\"button\" href=\"#track-carousel\" data-slide=\"next\"> <span class=\"glyphicon glyphicon-chevron-right\" aria-hidden=\"true\"></span> <span class=\"sr-only\">Next</span> </a></div>\n</div>\n<div class=\"sc-1mhpmrk kWPuCU\" data-testid=\"spacer\">&nbsp;</div>\n<p class=\"summary-footnote fine-print\">The above amount and interest rates are indicated for illustration purpose only, please refer to DBS digibank HK app for details.\u00e2\u0080\u008b \u00e2\u0080\u008b</p>\n<ol class=\"summary-footnote fine-print\" start=\"4\" type=\"1\">\n<li>Eligible New Funds refers to the incremental balance comparing the deposit Account Balance within the Reward Counting Period to HKD / USD Deposit Balance on 3 September 2026, according to the Bank&rsquo;s record.\u00e2\u0080\u008b Click the narrow down button to find your benchmark before registration.\u00e2\u0080\u008b</li>\n<li>After completing registration, you will see a \"Application submitted\" page and you will receive a confirmation email from the Bank in the next working day after registration. If you do not receive it, please check your spam folder, or register again within the registration period.\u00e2\u0080\u008b</li>\n<li>After depositing funds, e$aver Interest calculation is calculated daily based on the day end Eligible New Funds balance. Note that the DBS Digibank HK App requires at least one business day to update the relevant records.</li>\n</ol>\n<div class=\"sc-1m
